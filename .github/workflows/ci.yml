name: Verify

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: web/backend/go.mod
      - name: Test and vet backend
        working-directory: web/backend
        run: |
          go test ./...
          go vet ./...

  agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: agent/go.mod
      - name: Test, vet, and build agent
        working-directory: agent
        run: |
          go test ./...
          go vet ./...
          go build ./...

  frontend:
    # Main-branch frontend changes are verified by deploy-pages before deployment.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          version: 10.27.0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/frontend/pnpm-lock.yaml
      - name: Install, lint, typecheck, and build frontend
        run: |
          pnpm --dir web/frontend install --frozen-lockfile
          pnpm --dir web/frontend lint
          pnpm --dir web/frontend typecheck
          pnpm --dir web/frontend build

  docs:
    # Main-branch docs changes are built by deploy-pages; the build fails on dead links.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          version: 10.27.0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml
      - name: Install and build docs
        run: |
          pnpm --dir docs install --frozen-lockfile
          pnpm --dir docs build

  compose-profile-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: web/backend/go.mod
      - name: Validate generated all-in-one, basic, and custom compose profiles
        working-directory: web/backend
        run: go test ./internal/api/handlers -run 'TestBuildAgentComposePassesDockerComposeValidation|TestBuildAgentComposeOmitsUnselectedPrivileges|TestAgentCustomProfileControlsJoinBundle' -v

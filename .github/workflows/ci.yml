name: Verify

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  # Release (release.yml) runs these same checks on the tagged commit before publishing images.
  workflow_call:
    inputs:
      ref:
        description: Commit to check out instead of the triggering one
        type: string
        required: false

# Checks only: this workflow never publishes images or deploys Pages. Release (release.yml) and
# Deploy demo (deploy-pages.yml) are separate workflows, so none of the three waits on the others.

permissions:
  contents: read

concurrency:
  # Superseded PR checks are cancelled; other runs never queue behind each other.
  group: ${{ github.event_name == 'pull_request' && format('verify-{0}', github.ref) || format('verify-run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      images: ${{ steps.changes.outputs.images }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - id: changes
        run: node .github/scripts/changes.mjs
      - name: Test deployment policies
        run: node --test .github/scripts/policies.test.mjs

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.27.x'
          cache-dependency-path: web/backend/go.sum
      - name: Test and vet backend
        working-directory: web/backend
        run: |
          go test ./...
          go vet ./...

  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.27.x'
          cache-dependency-path: agent/go.sum
      - name: Test, vet, and build agent
        working-directory: agent
        run: |
          go test ./...
          go vet ./...
          go build ./...

  frontend:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read # find the pull_request run that already passed e2e on this tree
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      # A main push skips e2e only when a successful pull_request run of this workflow passed it
      # on the identical git tree (same code, workflow, and specs); see reuse-e2e.mjs. Anything
      # else runs e2e: new trees from stale branches, failed lookups, release runs, and manual runs
      # (Actions > Verify > Run workflow on main forces it). Setting the FORCE_E2E repository
      # variable to true turns reuse off everywhere. PR runs only report what main would do.
      - name: Decide whether to reuse a pull request's e2e result
        id: reuse
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FORCE_E2E: ${{ vars.FORCE_E2E }}
        run: node .github/scripts/reuse-e2e.mjs
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10.27.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/frontend/pnpm-lock.yaml
      - name: Install, lint, typecheck, and build frontend
        run: |
          pnpm --dir web/frontend install --frozen-lockfile
          pnpm --dir web/frontend lint
          pnpm --dir web/frontend typecheck
          pnpm --dir web/frontend build
      - name: Read the Playwright version
        if: steps.reuse.outputs.reuse != 'true'
        id: playwright
        run: echo "version=$(pnpm --dir web/frontend exec playwright --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
      - name: Restore Playwright browsers
        if: steps.reuse.outputs.reuse != 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      # The runner image already has Chromium's system libraries; --with-deps only added apt
      # updates that occasionally stalled for minutes.
      - name: Install Playwright Chromium
        if: steps.reuse.outputs.reuse != 'true'
        run: pnpm --dir web/frontend exec playwright install chromium
      - name: Build and test demo
        if: steps.reuse.outputs.reuse != 'true'
        run: pnpm --dir web/frontend test:e2e
      - name: Build the demo whose tree already passed e2e
        if: steps.reuse.outputs.reuse == 'true'
        run: pnpm --dir web/frontend build:demo
      # Only PR runs record a pass; main only ever reuses results from pull_request runs.
      - name: Record the tree that passed e2e
        if: github.event_name == 'pull_request'
        run: git rev-parse 'HEAD^{tree}' > e2e-tree.txt
      - name: Upload the e2e pass record
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-passed-tree-${{ steps.reuse.outputs.tree }}
          path: e2e-tree.txt
          retention-days: 30
          overwrite: true # a re-run attempt records the same tree again
      - name: Preserve Playwright failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-results
          path: web/frontend/test-results/
          retention-days: 14
          if-no-files-found: ignore

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          # VitePress lastUpdated needs the history of the deployed files.
          fetch-depth: 0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10.27.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml
      - name: Install and build docs
        run: |
          pnpm --dir docs install --frozen-lockfile
          pnpm --dir docs build

  docker-smoke:
    needs: changes
    if: needs.changes.outputs.images == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: web
            context: .
            dockerfile: web/Dockerfile
          - kind: agent
            context: ./agent
            dockerfile: agent/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the runtime image without publishing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          load: true
          tags: everyup-smoke:${{ matrix.kind }}
          build-args: EVERYUP_AGENT_IMAGE=aiturn/everyup-agent:smoke
          cache-from: type=gha,scope=${{ matrix.kind }}
          cache-to: type=gha,mode=max,scope=${{ matrix.kind }}
      - name: Check startup, HTTP responses, and packaged files
        run: bash .github/scripts/smoke-image.sh '${{ matrix.kind }}' 'everyup-smoke:${{ matrix.kind }}'

  compose-profile-smoke:
    needs: [changes, docker-smoke]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require successful image validation when images changed
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          IMAGES_CHANGED: ${{ needs.changes.outputs.images }}
          IMAGE_RESULT: ${{ needs.docker-smoke.result }}
        run: |
          test "$CHANGES_RESULT" = success
          if [ "$IMAGES_CHANGED" = true ]; then test "$IMAGE_RESULT" = success; fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.27.x'
          cache-dependency-path: web/backend/go.sum
      - name: Validate generated all-in-one, basic, and custom compose profiles
        working-directory: web/backend
        run: go test ./internal/api/handlers -run 'TestBuildAgentComposePassesDockerComposeValidation|TestBuildAgentComposeOmitsUnselectedPrivileges|TestAgentCustomProfileControlsJoinBundle' -v

name: Deploy Docs and Demo to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - web/frontend/**
      - docs/**
      - .github/workflows/deploy-pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5
        with:
          version: 10.27.0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            web/frontend/pnpm-lock.yaml
            docs/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: web/frontend
        run: pnpm install --frozen-lockfile

      - name: Lint and typecheck frontend
        working-directory: web/frontend
        run: |
          pnpm lint
          pnpm typecheck

      - name: Install Playwright Chromium
        working-directory: web/frontend
        run: pnpm exec playwright install --with-deps chromium

      - name: Build and test demo
        working-directory: web/frontend
        run: pnpm test:e2e

      - name: Build docs
        working-directory: docs
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      # Docs at /everyup/, demo at /everyup/demo/.
      # Pages serves only the root 404.html, so it is the demo shell (deep links
      # survive a reload) and any other missing path goes to the docs home.
      # ponytail: no docs 404 page; add a branch here if one is ever needed.
      - name: Assemble site
        run: |
          cp -r docs/.vitepress/dist _site
          cp -r web/frontend/dist _site/demo
          sed 's#<head>#<head><script>if(!location.pathname.startsWith("/everyup/demo/"))location.replace("/everyup/")</script>#' web/frontend/dist/index.html > _site/404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

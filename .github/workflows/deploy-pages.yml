name: Deploy Docs and Demo to GitHub Pages

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pages-docs
          path: _site
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pages-demo
          path: _site/demo
      - name: Assemble and validate the tested site
        run: node .github/scripts/assemble-pages.mjs
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Verify runs on main no longer queue, so deploys are serialized here instead.
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    steps:
      # Checked inside the serialized job: a run that finishes after a newer main must not
      # overwrite the newer site.
      - name: Deploy only the current main commit
        id: head
        env:
          REPOSITORY: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
        run: |
          head=$(git ls-remote --exit-code "https://github.com/$REPOSITORY" refs/heads/main | cut -f1)
          if [ "$head" = "$COMMIT" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            printf '### Pages\n\nSkipped: main has moved to `%s`; that run deploys instead.\n' "$head" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Deploy to GitHub Pages
        if: steps.head.outputs.current == 'true'
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

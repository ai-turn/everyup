name: Release

# Publishes Docker images for a release tag, and only for one. The tagged commit runs the full
# Verify checks inside this run (not a lookup of some other run), so a release never waits on or
# trusts a Verify run elsewhere, and nothing is pushed to Docker Hub until every check passes.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to (re)publish, e.g. v1.2.3
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      commit: ${{ steps.resolve.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Resolve the tag to a commit and validate its name
        id: resolve
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          # Fails for anything that is not vMAJOR.MINOR.PATCH[-prerelease].
          planned=$(node .github/scripts/release-tags.mjs "$TAG")
          git fetch --no-tags --depth=1 origin "+refs/tags/$TAG:refs/tags/$TAG"
          commit=$(git rev-parse "refs/tags/$TAG^{commit}")
          { echo "tag=$TAG"; echo "commit=$commit"; } >> "$GITHUB_OUTPUT"
          printf '### Release %s\n\nCommit: `%s`\n\nImage tags if it publishes now: %s\n' \
            "$TAG" "$commit" "$(echo "$planned" | sed 's/.*/`&`/' | paste -sd, -)" >> "$GITHUB_STEP_SUMMARY"

  verify:
    needs: resolve
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.resolve.outputs.commit }}

  # Pushes only commit-addressable sha- tags; promote moves the human-facing tags.
  publish:
    needs: [resolve, verify]
    uses: ./.github/workflows/docker-publish.yml
    with:
      commit: ${{ needs.resolve.outputs.commit }}
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  promote:
    needs: [resolve, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      # promote-images.mjs reads the repository's tags inside this group, so latest goes to the
      # newest stable release no matter which release run finishes last.
      group: docker-image-promotion
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: image-digest-*
          merge-multiple: true
      - name: Promote the verified pair and record rollback references
        env:
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.resolve.outputs.commit }}
        run: node .github/scripts/promote-images.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-manifest
          path: release-manifest.json
          retention-days: 90

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ['*']
  - package-ecosystem: docker
    directories:
      - /web
      - /agent
    schedule:
      interval: weekly
    groups:
      base-images:
        patterns: ['*']
    ignore:
      # Stay on Node LTS. Moving majors needs a deliberate change (Node 25+ ships without corepack).
      - dependency-name: node
        update-types: ['version-update:semver-major']

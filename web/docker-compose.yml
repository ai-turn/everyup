# =============================================================================
# EveryUp Web: browser dashboard, alert config, and history storage.
#
# Run without cloning the repo (only Docker required):
#   mkdir everyup && cd everyup
#   curl -O https://raw.githubusercontent.com/ai-turn/everyup/main/web/docker-compose.yml
#   docker compose up -d
# Then open http://localhost:3001 and create an admin account.
# =============================================================================

services:
  everyup:
    image: aiturn/everyup:latest
    # Build from source instead of the pre-built image (run from the repo root,
    # the web image expects the repo root as its build context):
    # build:
    #   context: ..
    #   dockerfile: web/Dockerfile
    container_name: everyup
    environment:
      EVERYUP_PUBLIC_URL: ${EVERYUP_PUBLIC_URL:-}
    ports:
      - "3001:3001"
    volumes:
      - everyup-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  everyup-data:
    driver: local
